<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodge Dash - Responsive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #0a0a0f; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  canvas { 
    background: linear-gradient(180deg, #1a1a2e 0%, #0a0a0f 100%);
    border: 2px solid #16213e;
    box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
    display: block;
  }
  #ui {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #00d4ff;
    font-size: 4vw; /* scales with screen width */
    font-weight: 600;
    text-shadow: 0 0 10px #00d4ff;
  }
</style>
</head>
<body>
<div id="ui">Score: <span id="score">0</span></div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

// ===== GAME STATE =====
const Game = {
  running: true,
  score: 0,
  lastTime: 0,
  spawnTimer: 0
}

// ===== PLAYER CLASS =====
class Player {
  constructor() {
    this.w = 40; this.h = 40;
    this.x = 0; this.y = 0;
    this.speed = 0;
    this.color = '#00d4ff';
    this.resetPosition();
  }
  
  resetPosition() {
    this.x = canvas.width / 2 - this.w / 2;
    this.y = canvas.height - this.h - 20;
    this.speed = canvas.width / 2; // scales with screen size
  }
  
  update(dt, keys) {
    if (keys['ArrowLeft'] || keys['a']) this.x -= this.speed * dt;
    if (keys['ArrowRight'] || keys['d']) this.x += this.speed * dt;
    this.x = Math.max(0, Math.min(canvas.width - this.w, this.x));
  }
  
  draw() {
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    ctx.fillRect(this.x, this.y, this.w, this.h);
    ctx.shadowBlur = 0;
  }
  
  getBounds() { return {x: this.x, y: this.y, w: this.w, h: this.h}; }
}

// ===== OBSTACLE CLASS =====
class Obstacle {
  constructor() {
    this.w = 30 + Math.random() * 30;
    this.h = 30 + Math.random() * 30;
    this.x = Math.random() * (canvas.width - this.w);
    this.y = -this.h;
    this.speed = canvas.height / 3 + Math.random() * (canvas.height / 3);
    this.color = `hsl(${Math.random()*60 + 340}, 100%, 60%)`;
  }
  
  update(dt) {
    this.y += this.speed * dt;
    return this.y > canvas.height;
  }
  
  draw() {
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.color;
    ctx.fillRect(this.x, this.y, this.w, this.h);
    ctx.shadowBlur = 0;
  }
  
  getBounds() { return {x: this.x, y: this.y, w: this.w, h: this.h}; }
}

// ===== GAME LOGIC =====
const player = new Player();
const obstacles = [];
const keys = {};

function rectCollision(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && 
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function update(dt) {
  player.update(dt, keys);
  
  // Spawn obstacles
  Game.spawnTimer += dt;
  if (Game.spawnTimer > 0.6) {
    obstacles.push(new Obstacle());
    Game.spawnTimer = 0;
  }
  
  // Update obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    if (obstacles[i].update(dt)) {
      obstacles.splice(i, 1);
      Game.score += 10;
      scoreEl.textContent = Game.score;
    }
    else if (rectCollision(player.getBounds(), obstacles[i].getBounds())) {
      Game.running = false;
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Grid background
  ctx.strokeStyle = 'rgba(0, 212, 255, 0.05)';
  for(let i = 0; i < canvas.width; i += 40) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
  }
  
  player.draw();
  obstacles.forEach(o => o.draw());
  
  if (!Game.running) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = `${canvas.width/15}px Segoe UI`;
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
    ctx.font = `${canvas.width/30}px Segoe UI`;
    ctx.fillText(`Final Score: ${Game.score}`, canvas.width/2, canvas.height/2 + 50);
    ctx.fillText('Press R or Tap to Restart', canvas.width/2, canvas.height/2 + 90);
  }
}

function gameLoop(timestamp) {
  const dt = (timestamp - Game.lastTime) / 1000;
  Game.lastTime = timestamp;
  
  if (Game.running) update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

// ===== INPUT =====
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'r' && !Game.running) restartGame();
});
window.addEventListener('keyup', e => keys[e.key] = false);

// Touch controls
canvas.addEventListener('touchstart', e => {
  const touchX = e.touches[0].clientX;
  if (touchX < canvas.width / 2) keys['ArrowLeft'] = true;
  else keys['ArrowRight'] = true;
  if (!Game.running) restartGame();
});
canvas.addEventListener('touchend', () => {
  keys['ArrowLeft'] = false;
  keys['ArrowRight'] = false;
});

// ===== RESIZE =====
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  player.resetPosition();
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ===== RESTART =====
function restartGame() {
  Game.running = true;
  Game.score = 0;
  obstacles.length = 0;
  scoreEl.textContent = 0;
}

// ===== START =====
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
